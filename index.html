<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d97706" />
  <meta name="description" content="Dog Trainer — персональный кинолог в кармане. Программа дрессировки под вашу собаку." />
  <title>Dog Trainer — персональный кинолог</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🐕</text></svg>" />
</head>
<body>
  <!-- Экраны -->
  <main id="app">
    <section id="screen-onboarding" class="screen" aria-label="Онбординг"></section>
    <section id="screen-home" class="screen" aria-label="Главная"></section>
    <section id="screen-program" class="screen" aria-label="Программа"></section>
    <section id="screen-library" class="screen" aria-label="Библиотека команд"></section>
    <section id="screen-problems" class="screen" aria-label="Решение проблем"></section>
    <section id="screen-progress" class="screen" aria-label="Прогресс"></section>
  </main>

  <!-- Нижняя навигация -->
  <nav id="bottom-nav" aria-label="Основная навигация"></nav>

  <!-- Модальное окно -->
  <div id="modal" role="dialog" aria-modal="true">
    <div id="modal-body"></div>
  </div>

  <!-- Тосты -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Скрипты -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
